function saveTaskCard(event,id){
  event.stopPropagation();
  const task=data.tasks.find(item=>item.id===id);
  if(!task)return;
  const dependencyId=document.getElementById(`task-edit-dependency-${id}`).value;
  if(!validateDependency(id,dependencyId))return;
  const name=document.getElementById(`task-edit-name-${id}`).value.trim();
  const type=document.getElementById(`task-edit-type-${id}`).value;
  const color=document.getElementById(`task-edit-color-${id}`);
  const nodeSymbol=document.getElementById(`task-edit-node-symbol-${id}`);
  const start=document.getElementById(`task-edit-start-${id}`).value;
  let end=document.getElementById(`task-edit-end-${id}`).value;
  if(!name||!start||(!end&&type!=='milestone')){alert('请填写任务名称和开始、结束日期');return}
  if(type==='milestone')end=start;
  if(isMilestoneTask({type}))end=start;
  if(parseDate(end)<parseDate(start)){alert('结束日期不能早于开始日期');return}
  const parentId=document.getElementById(`task-edit-parent-${id}`).value;
  const previousType=task.type;
  const previousParentId=task.parent;
  const nextParentId=resolveParentAfterTypeChange(task,previousType,type,parentId);
  detachChildrenWhenChangingToMilestone(task,type);
  task.name=name;
  task.type=type;
  if(type==='summary')task.color=document.getElementById(`task-edit-color-${id}`).value;
  else if(type==='milestone')task.color=document.getElementById(`task-edit-color-${id}`).value;
  else if(!isLaneTask({type})&&(previousType==='summary'||previousType==='milestone'))task.color=undefined;
  task.start=start;
  task.end=end;
  task.durationDays=type==='task'?getDurationDays(start,end):1;
  if(type!=='summary')task.progress=Math.min(1,Math.max(0,Number(document.getElementById(`task-edit-progress-${id}`).value)||0)/100);
  task.assignee=document.getElementById(`task-edit-assignee-${id}`).value.trim()||'';
  task.parent=nextParentId;
  if(type==='summary'&&previousType!=='summary'&&previousParentId!=null){
    moveTaskTreeAfterParent(task,task.parent);
  }
  const lagSign=document.getElementById(`task-edit-lag-sign-${id}`);
  const lagValue=document.getElementById(`task-edit-lag-value-${id}`);
  const lagUnit=document.getElementById(`task-edit-lag-unit-${id}`);
  task.dependency=isLaneTask({type})||!dependencyId?undefined:{taskId:data.tasks.find(item=>String(item.id)===String(dependencyId)).id,type:document.getElementById(`task-edit-dependency-type-${id}`).value,lagSign:lagSign.value,lagValue:Math.max(0,Number(lagValue.value)||0),lagUnit:lagUnit.value};
  task.symbol=type==='milestone'?document.getElementById(`task-edit-symbol-${id}`).value:isLaneTask({type})?nodeSymbol?.value||'◆':undefined;
  task.content=isLaneTask({type})?document.getElementById(`task-edit-content-${id}`).value.trim():undefined;
  if(type==='summary'||isLaneTask({type}))task.assignee='';
  if(type==='task')task.end=getEndDate(task.start,task.durationDays);
  recalculateDependencySchedule();
  saveData();
  renderAll();
}

// ===== 甘特图 =====
function renderGantt(){
  document.documentElement.dataset.ganttBuild=APP_BUILD_VERSION;
  document.documentElement.dataset.ganttVersion=APP_BUILD_VERSION;
  ganttScroll.style.setProperty('--gantt-name-width',`${ganttNameWidth}px`);
  const allSorted=getSorted();
  const laneTasks=allSorted.filter(isLaneTask);
  const sorted=allSorted.filter(t=>!isLaneTask(t));
  const outlineNumbers=getTaskOutlineNumbers();
  // 计算时间范围
  let min=Infinity,max=-Infinity;
  allSorted.forEach(t=>{
    const s=parseDate(t.start),e=parseDate(t.end);
    if(s<min)min=s;if(e>max)max=e;
  });
  if(min===Infinity){min=parseDate(data.projectStart||fmtDate(new Date()));max=shiftCalendarDays(min,30)}
  const projectStart=data.projectStart?parseDate(data.projectStart):min;
  if(projectStart<min)min=projectStart;
  if(projectStart>max)max=projectStart;
  const visibleStart=new Date(min),visibleEnd=new Date(max);
  min=new Date(min.getTime()-7*86400000);
  max=new Date(max.getTime()+7*86400000);
  const rangeDays=Math.max(1,Math.ceil(diffDays(min,max))+1);
  const summaryTextWidth=sorted.filter(task=>task.type==='summary').reduce((width,task)=>{
    ganttTextMeasureContext.font='650 10px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
    return Math.max(width,ganttTextMeasureContext.measureText(String(task.name||'')).width+24);
  },0);
  ganttDependencyMin=min;
  const ganttTable=document.getElementById('ganttTable');
  const timelineUnits=normalizeTimelineUnits(data.timelineUnits);
  const visibleTaskCount=allSorted.filter(task=>!getCollapsedAncestorId(task)).length;
  const availableTimelineWidth=Math.max(420,(ganttScroll.clientWidth||900)-ganttNameWidth-40);
  const finestUnit=timelineUnits[timelineUnits.length-1];
  const unitDays={year:365.25,quarter:365.25/4,month:365.25/12,week:7,day:1};
  const unitWidths={year:56,quarter:48,month:42,week:38,day:36};
  const maxDayWidth=unitWidths[finestUnit]/unitDays[finestUnit];
  const automaticDayWidth=finestUnit==='day'
    ?Math.max(8,Math.min(36,availableTimelineWidth/rangeDays))
    :Math.max(0.1,Math.min(36,availableTimelineWidth/rangeDays,maxDayWidth));
  ganttDayWidth=automaticDayWidth*ganttZoom;
  const summaryExtraDays=summaryTextWidth?Math.ceil(summaryTextWidth/ganttDayWidth):0;
  const totalDays=rangeDays+summaryExtraDays;
  const compactRowHeight=visibleTaskCount<=1?52:Math.max(22,Math.min(38,Math.floor((ganttScroll.clientHeight||650)/visibleTaskCount)));
  ganttRowHeight=Math.max(30,compactRowHeight);
  const compactLevel=ganttDayWidth<9?2:ganttDayWidth<17?1:0;
  ganttTable.style.setProperty('--gantt-day-width',`${ganttDayWidth}px`);
  ganttTable.style.setProperty('--gantt-row-height',`${ganttRowHeight}px`);
  ganttTable.style.setProperty('--gantt-row-pad',`${Math.max(2,Math.floor((ganttRowHeight-20)/2))}px`);
  const tableWidth=ganttNameWidth+totalDays*ganttDayWidth;
  ganttTable.style.width=`${tableWidth}px`;
  ganttTable.style.minWidth=`${tableWidth}px`;
  ganttScroll.classList.toggle('timeline-long',ganttDayWidth<18);
  ganttScroll.classList.toggle('timeline-compact',compactLevel>=1);
  ganttScroll.classList.toggle('timeline-ultracompact',compactLevel>=2);
  ganttTable.style.setProperty('--gantt-print-scale',String(Math.min(1,32/Math.max(ganttDayWidth,1))));

  // 表头按年、月、日分组
  const days=[];
  for(let d=new Date(min);days.length<totalDays;d.setDate(d.getDate()+1))days.push(new Date(d));
  document.getElementById('ganttTable').style.setProperty('--timeline-row-count',String(timelineUnits.length));
  const rowClassByUnit={year:'year-row',quarter:'quarter-row',month:'month-row',week:'week-row',day:'day-row'};
  const rowBackgroundByUnit={year:'#edf1f7',quarter:'#f3f5f9',month:'#fafbfc',week:'#fff',day:'#fff'};
  let hh='';
  timelineUnits.forEach((unit,rowIndex)=>{
    const groups=groupTimelineDates(days,unit);
    hh+=`<tr class="scale-row ${rowClassByUnit[unit]}" data-unit="${unit}" style="--scale-row-index:${rowIndex};background:${rowBackgroundByUnit[unit]}">`;
    if(rowIndex===0)hh+='<th class="name-col" rowspan="'+timelineUnits.length+'">任务名称</th>';
    groups.forEach(group=>{
      const startDate=group.startDate;
      const todayInGroup=days.some(date=>getTimelinePeriod(date,unit).key===group.key&&fmtDate(date)===fmtDate(TODAY));
      const isVisiblePeriod=days.some(date=>getTimelinePeriod(date,unit).key===group.key&&date>=visibleStart&&date<=visibleEnd);
      let label=getTimelineEnglishLabel(startDate,unit);
      if(unit==='day'){
        const isWeekend=startDate.getDay()===0||startDate.getDay()===6;
        const dayLabel=ganttDayWidth<15?String(startDate.getDate()):label;
        hh+=`<th class="day-heading" colspan="${group.count}" style="${isWeekend?'color:#bbb;':''}${todayInGroup?'color:#e74c3c;font-weight:700;':''}${isVisiblePeriod?'':'opacity:.42'}">${dayLabel}</th>`;
      }else{
        hh+=`<th colspan="${group.count}" style="${todayInGroup?'color:#e74c3c;font-weight:700;':''}${isVisiblePeriod?'':'opacity:.42'}">${label}</th>`;
      }
    });
    hh+='</tr>';
  });
  document.getElementById('ganttHead').innerHTML=hh;

  // 主体
  let bb='';
  let ci=0;
  let gridMarkup='';
  for(let i=0;i<totalDays;i++){
    const d=new Date(min.getTime()+i*86400000);
    const day=d.getDay();
    const isWE=day===0||day===6;
    const isT=fmtDate(d)===fmtDate(TODAY);
    if(isWE)gridMarkup+=`<div class="grid-weekend" style="left:${i*ganttDayWidth}px;width:${ganttDayWidth}px"></div>`;
    else gridMarkup+=`<div class="grid-line" style="left:${i*ganttDayWidth}px"></div>`;
    if(isT){
      gridMarkup+=`<div class="today-line" style="left:${i*ganttDayWidth+ganttDayWidth/2}px"></div>`;
      gridMarkup+=`<div class="today-label" style="left:${i*ganttDayWidth+ganttDayWidth/2}px">今天</div>`;
    }
  }
  bb+=renderGanttLaneHeader('customerMilestone',totalDays,gridMarkup);
  bb+=renderGanttLaneHeader('supplierNode',totalDays,gridMarkup);
  laneTasks.forEach(t=>{
    if(getCollapsedAncestorId(t))return;
    const laneLabel=data.ganttLaneNames[t.type];
    const hasPredecessor=hasPredecessorTask(t);
    const left=diffDays(min,parseDate(t.start))*ganttDayWidth+ganttDayWidth/2;
    const taskName=escapeHtml(getNumberedTaskName(t,outlineNumbers));
    const nodeContent=String(t.content||t.name||'').trim();
    bb+=`<tr data-task-row-id="${escapeHtml(t.id)}" class="gantt-lane-row"><td><div class="name-cell"><div class="gantt-name-stack"><span class="nm gantt-task-name milestone${hasPredecessor?' has-predecessor':''}" role="button" tabindex="0" data-task-id="${escapeHtml(t.id)}" aria-expanded="${ganttQuickEditTaskIds.has(String(t.id))}" aria-label="快速编辑${taskName}" onclick="toggleGanttQuickTaskEdit(event,this.dataset.taskId)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGanttQuickTaskEdit(event,this.dataset.taskId)}">${taskName}</span>${renderGanttQuickEdit(t,'#ff9800')}</div></div></td><td colspan="${Math.ceil(totalDays)}" style="padding:0;position:relative"><div class="bar-area" style="width:${totalDays*ganttDayWidth}px">${gridMarkup}<div class="lane-node-marker" style="left:${left}px;max-width:min(200px,calc(100% - ${left}px))"><span class="lane-node-date" aria-label="日期 ${t.start}">${ganttDayWidth<9?TIMELINE_MONTHS_EN[parseDate(t.start).getMonth()]+' '+parseDate(t.start).getDate():t.start}</span><button type="button" class="lane-node-symbol" data-task-id="${escapeHtml(t.id)}" aria-label="点击${taskName}旁输入节点内容" title="编辑节点内容" onclick="toggleLaneContentEditor(event,'${escapeHtml(t.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLaneContentEditor(event,'${escapeHtml(t.id)}')}" onmouseenter="safeTip(event,this)" onmouseleave="hideTip()" onmousemove="moveTip(event)">${getMilestoneSymbol(t)}</button><textarea class="lane-node-content-editor" data-task-id="${escapeHtml(t.id)}" aria-label="编辑${taskName}的节点内容" placeholder="输入节点内容" oninput="saveLaneContent(this)" onblur="finishLaneContentEdit(this)" onkeydown="if(event.key==='Escape'){cancelLaneContentEditor(event);this.blur()}event.stopPropagation()" hidden ${nodeContent?`value="${escapeHtml(nodeContent)}"`:''}></textarea><button type="button" class="lane-node-label" data-task-id="${escapeHtml(t.id)}" aria-label="编辑节点内容：${escapeHtml(nodeContent||'未填写')}" title="点击编辑节点内容" onclick="toggleLaneContentEditor(event,'${escapeHtml(t.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLaneContentEditor(event,'${escapeHtml(t.id)}')} ">${escapeHtml(nodeContent||'添加节点内容')}</button></div></div></td></tr>`;
  });
  sorted.forEach((t,ri)=>{
    const hiddenByPhase=getCollapsedAncestorId(t);
    const s=parseDate(t.start);
    const left=diffDays(min,s),dur=getDurationDays(t.start,t.end);
    const isP=t.type==='summary',isM=isMilestoneTask(t);
    const hasPredecessor=hasPredecessorTask(t);
    const pct=Math.round((t.progress||0)*100);
    const isOverdue=pct<100&&parseDate(t.end)<TODAY;
    const bc=isP||isM?t.color||(isP?'#4361ee':'#ff9800'):isOverdue?'#e53935':t.color||(pct>=100?'#4caf50':'#ff9800');

    bb+=`<tr data-task-row-id="${escapeHtml(t.id)}" class="${t.dependency?.taskId!=null?'has-dependency':''}"${hiddenByPhase?' hidden':''}><td><div class="name-cell">`;
    const depth=getTaskDepth(t);
    if(depth)bb+=`<span class="indent" style="width:${depth*18}px"></span>`;
    if(isP){
      const collapsed=collapsedPhaseIds.has(String(t.id));
      bb+=`<button type="button" class="phase-toggle" data-phase-id="${escapeHtml(t.id)}" aria-expanded="${!collapsed}" aria-label="${collapsed?'展开':'折叠'}${escapeHtml(getNumberedTaskName(t,outlineNumbers))}" title="${collapsed?'展开':'折叠'}阶段下任务" onclick="togglePhaseCollapse(this.dataset.phaseId)">${collapsed?'▶':'▼'}</button>`;
    }
    bb+='<div class="gantt-name-stack">';
    bb+=`<span class="nm gantt-task-name ${isP?'parent':''} ${isM?'milestone':''}${hasPredecessor?' has-predecessor':''}" role="button" tabindex="0" data-task-id="${escapeHtml(t.id)}" aria-expanded="${!isP&&ganttQuickEditTaskIds.has(String(t.id))}" oncontextmenu="openTaskContextMenu(event,this.dataset.taskId)" onclick="toggleGanttQuickTaskEdit(event,this.dataset.taskId)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGanttQuickTaskEdit(event,this.dataset.taskId)}">${escapeHtml(getNumberedTaskName(t,outlineNumbers))}</span>`;
    if(!isP)bb+=renderGanttQuickEdit(t,bc);
    const siblings=getTaskSiblings(t);
    const siblingIndex=siblings.findIndex(item=>String(item.id)===String(t.id));
    const moveUpLabel=interfaceLanguage==='en'?'Move up':'上移';
    const moveDownLabel=interfaceLanguage==='en'?'Move down':'下移';
    bb+=`<span class="gantt-task-order" onclick="event.stopPropagation()"><button type="button" title="${moveUpLabel}" aria-label="${moveUpLabel} ${escapeHtml(t.name)}" onclick="moveTaskSibling('${escapeHtml(t.id)}',-1)" ${siblingIndex<=0?'disabled':''}>▲</button><button type="button" title="${moveDownLabel}" aria-label="${moveDownLabel} ${escapeHtml(t.name)}" onclick="moveTaskSibling('${escapeHtml(t.id)}',1)" ${siblingIndex<0||siblingIndex>=siblings.length-1?'disabled':''}>▼</button></span>`;
    bb+='</div>';
    if(t.assignee)bb+=`<span class="assign">${escapeHtml(t.assignee)}</span>`;
    bb+='</div></td>';

    const taskName=String(t.name||'');
    const barLabel=isP?taskName:showGanttProgressLabels?`${pct}% ${taskName}`:taskName;
    const barFontSize=ganttDayWidth<9?8:ganttDayWidth<17?9:10;
    ganttTextMeasureContext.font=`${isP?650:600} ${isP?10:barFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif`;
    const barLabelWidth=ganttTextMeasureContext.measureText(barLabel).width;
    const barHorizontalPadding=ganttDayWidth<9?2:ganttDayWidth<17?4:10;
    const shortBar=!isP&&!isM&&Math.max(dur*ganttDayWidth-2,5)<barLabelWidth+barHorizontalPadding+2;
    const showNameAbove=shortBar;
    const bl=left*ganttDayWidth;
    const bw=isP?Math.max(dur*ganttDayWidth-2,barLabelWidth+16):dur*ganttDayWidth-2;
    bb+=`<td colspan="${Math.ceil(totalDays)}" style="padding:0;position:relative"><div class="bar-area${showNameAbove?' has-task-label':''}">`;

    bb+=gridMarkup;

    // 条
    if(!isM){
      const dateLabel=ganttDayWidth<7?date=>`${TIMELINE_MONTHS_EN[parseDate(date).getMonth()]} ${parseDate(date).getDate()}`:date=>date;
      const startLabelLeft=bl;
      const endLabelLeft=bl+Math.max(bw,5);
      const labelsOverlap=endLabelLeft-startLabelLeft<Math.max(52,(dateLabel(t.start).length+dateLabel(t.end).length)*5.5);
      const placeEndDateBelow=labelsOverlap||(!isP&&(shortBar||ganttDayWidth<12));
      if(!placeEndDateBelow){
          bb+=`<span class="task-date-label start" data-label-kind="start-date" style="left:${startLabelLeft}px">${dateLabel(t.start)}</span><span class="task-date-label end" data-label-kind="end-date" style="left:${endLabelLeft}px">${dateLabel(t.end)}</span>`;
        }else{
          bb+=`<span class="task-date-label start" data-label-kind="start-date" style="left:${startLabelLeft}px">${dateLabel(t.start)}</span><span class="task-date-label end date-below task-date-below" data-label-kind="end-date" style="left:${endLabelLeft}px">${dateLabel(t.end)}</span>`;
        }
      bb+=`<div class="bar ${isP?'summary':'task'}${isOverdue?' overdue':''}" style="left:${bl}px;width:${Math.max(bw,5)}px;background:${bc}"
            onmouseenter="safeTip(event,this)" onmouseleave="hideTip()" onmousemove="moveTip(event)">
            <div class="pf" style="width:${pct}%"></div><span class="bar-label"${isP?` style="color:${getContrastingTextColor(bc)}"`:''}>${isP?escapeHtml(taskName):showGanttProgressLabels?(shortBar?`${pct}%`:`${pct}% ${escapeHtml(taskName)}`):(shortBar?'':escapeHtml(taskName))}</span></div>${showNameAbove?`<span class="task-name-above${hasPredecessor?' has-predecessor':''}" style="left:${bl}px">${escapeHtml(taskName)}</span>`:''}`;
    }else{
      const markerWidth=18;
      const centerX=left*ganttDayWidth+ganttDayWidth/2;
      const markerLeft=centerX-markerWidth/2;
      bb+=`<div class="bar milestone-symbol" style="left:${markerLeft}px;color:${bc}"
            onmouseenter="safeTip(event,this)" onmouseleave="hideTip()" onmousemove="moveTip(event)">${getMilestoneSymbol(t)}</div>`;
    }

    bb+='</div></td></tr>';
  });
  document.getElementById('ganttBody').innerHTML=bb;
  groupGanttLaneRows();
  ganttNameResizer.style.left=`${document.querySelector('.gantt-table .name-col').getBoundingClientRect().width+ganttScroll.scrollLeft}px`;
  renderDependencies(allSorted.filter(task=>!getCollapsedAncestorId(task)),min);

  // 项目信息
  if(document.activeElement!==projectNameInput)projectNameInput.value=data.projectName||'新项目';
  const first=data.tasks.length?data.tasks.reduce((a,b)=>parseDate(a.start)<parseDate(b.start)?a:b):null;
  const last=data.tasks.length?data.tasks.reduce((a,b)=>parseDate(a.end)>parseDate(b.end)?a:b):null;
  if(first&&last){
    const td=Math.round(diffDays(parseDate(first.start),parseDate(last.end)))+1;
    document.getElementById('projectInfo').textContent=
      `项目周期：${first.start} ~ ${last.end} ｜ 共 ${td} 天 ｜ 今日：${fmtDate(TODAY)}`;
  }else document.getElementById('projectInfo').textContent='添加任务后显示项目周期';
}

function renderDependencies(sorted,min){
  const scroll=document.getElementById('ganttScroll');
  const existing=scroll.querySelector('.dependency-layer');
  if(existing)existing.remove();
  scroll.querySelector('.dependency-label-layer')?.remove();
  const menu=document.getElementById('timelineConfigMenu');
  const timelineButton=document.getElementById('timelineConfigToggle');
  const timelineMenuWasOpen=menu&&!menu.hidden;
  const timelineMenuOptionState=timelineMenuWasOpen?[...menu.querySelectorAll('input[type="checkbox"]')].map(input=>({value:input.value,checked:input.checked})):[];
  if(timelineMenuWasOpen){menu.hidden=true;menu.style.left='';menu.style.top='';document.querySelector('.timeline-config').appendChild(menu)}
  const restoreTimelineMenu=()=>{
    if(!timelineMenuWasOpen)return;
    openTimelineMenu();
    timelineMenuOptionState.forEach(state=>{const input=menu.querySelector(`input[value="${state.value}"]`);if(input)input.checked=state.checked});
    applyTimelineMenuPosition(menu,timelineButton);
    timelineButton.setAttribute('aria-expanded','true');
  };
  const linked=sorted.filter(task=>task.dependency&&task.dependency.taskId!=null);
  if(!linked.length){runGanttLayoutAudit();restoreTimelineMenu();return}
  const outlineNumbers=getTaskOutlineNumbers(sorted);

  const table=document.getElementById('ganttTable');
  const body=document.getElementById('ganttBody');
  const rows=Array.from(body.querySelectorAll('tr'));
  const rowById=new Map();
  const laneMarkerById=new Map();
  body.querySelectorAll('.lane-node-symbol[data-task-id]').forEach(marker=>{
    laneMarkerById.set(String(marker.dataset.taskId),marker);
  });
  sorted.forEach(task=>{
    const row=rows.find(item=>item.dataset.taskRowId===String(task.id));
    if(row)rowById.set(task.id,row);
  });
  const bodyRect=body.getBoundingClientRect();
  const scrollRect=scroll.getBoundingClientRect();
  const svgTop=bodyRect.top-scrollRect.top+scroll.scrollTop;
  const width=table.offsetWidth;
  const height=body.offsetHeight;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
   svg.setAttribute('class',`dependency-layer${showGanttDependencyLines?'':' links-hidden'}`);
  svg.setAttribute('width',String(width));
  svg.setAttribute('height',String(height));
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
  svg.style.left='0px';
  svg.style.top=`${svgTop}px`;
  const dependencyColors=['#d1495b','#1768ac','#2a9d68','#9b59b6','#e17c05','#008b8b','#4b6cb7','#bb3e03','#007f5f','#7b2cbf'];
    const markerDefs=dependencyColors.map((color,index)=>`<marker id="dependencyArrow${index}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${color}"></path></marker>`).join('');
  svg.innerHTML=`<defs>${markerDefs}</defs>`;
  scroll.insertBefore(svg,scroll.firstChild);

  const nameWidth=table.querySelector('.name-col').getBoundingClientRect().width;
  const getEndpoint=(item,row,edge)=>{
    if(isLaneTask(item)){
      const marker=laneMarkerById.get(String(item.id));
      if(!marker)return null;
      const rect=marker.getBoundingClientRect();
      return {
        x:rect.left-scrollRect.left+scroll.scrollLeft+rect.width/2,
        y:rect.top-bodyRect.top+rect.height/2,
      };
    }
    if(!row)return null;
    const rect=row.getBoundingClientRect();
     const bar=row.querySelector('.bar:not(.milestone-symbol)');
     const milestone=row.querySelector('.bar.milestone-symbol');
     if(bar){
       const barRect=bar.getBoundingClientRect();
       return {
         x:(edge==='finish'?barRect.right:barRect.left)-scrollRect.left+scroll.scrollLeft,
         y:rect.top-bodyRect.top+rect.height/2,
       };
     }
     if(milestone){
       const markerRect=milestone.getBoundingClientRect();
       return {x:markerRect.left-scrollRect.left+scroll.scrollLeft+markerRect.width/2,y:rect.top-bodyRect.top+rect.height/2};
     }
     const offset=diffDays(min,parseDate(item.start));
    return {
      x:nameWidth+offset*ganttDayWidth+(edge==='finish'?getDurationDays(item.start,item.end)*ganttDayWidth:0),
      y:rect.top-bodyRect.top+rect.height/2,
    };
  };
  const renderedLinks=[];
  let crossingLinkCount=0;
  const segmentsIntersect=(firstStart,firstEnd,secondStart,secondEnd)=>{
    const cross=(origin,a,b)=>(a.x-origin.x)*(b.y-origin.y)-(a.y-origin.y)*(b.x-origin.x);
    return cross(firstStart,firstEnd,secondStart)*cross(firstStart,firstEnd,secondEnd)<0
      &&cross(secondStart,secondEnd,firstStart)*cross(secondStart,secondEnd,firstEnd)<0;
  };
  linked.forEach((task,linkIndex)=>{
    const dependency=task.dependency;
    const predecessor=data.tasks.find(item=>String(item.id)===String(dependency.taskId));
    const fromRow=rowById.get(predecessor?.id);
    const toRow=rowById.get(task.id);
    if(!predecessor)return;
    const type=['FS','SF','FF','SS'].includes(dependency.type)?dependency.type:'FS';
    const fromEdge=type[0]==='S'?'start':'finish';
    const toEdge=type[1]==='S'?'start':'finish';
    const from=getEndpoint(predecessor,fromRow,fromEdge);
    const to=getEndpoint(task,toRow,toEdge);
    if(!from||!to) return;
    const {x:x1,y:y1}=from;
    const {x:x2,y:y2}=to;
    const bendX=x1+(x2-x1)/2;
    const points=[{x:x1,y:y1},{x:bendX,y:y1},{x:bendX,y:y2},{x:x2,y:y2}];
    const segments=points.slice(1).map((point,index)=>[points[index],point]);
    const crossingLinks=renderedLinks.filter(link=>segments.some(([start,end])=>link.segments.some(([otherStart,otherEnd])=>segmentsIntersect(start,end,otherStart,otherEnd))));
    const fallbackColorIndex=linkIndex%dependencyColors.length;
    const hasCrossing=crossingLinks.length>0;
    if(hasCrossing)crossingLinkCount++;
    const taskBar=fromRow?.querySelector('.bar:not(.milestone-symbol)');
    const taskSymbol=fromRow?.querySelector('.bar.milestone-symbol,.lane-node-symbol')||laneMarkerById.get(String(predecessor.id));
    const edgeColor=taskBar?getComputedStyle(taskBar).backgroundColor:taskSymbol?getComputedStyle(taskSymbol).color:dependencyColors[fallbackColorIndex];
    const chosenColorIndex=fallbackColorIndex;
    const markerId=`dependencyArrowLink${linkIndex}`;
    const marker=document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id',markerId);
    marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','8');marker.setAttribute('refX','7');marker.setAttribute('refY','4');marker.setAttribute('orient','auto');
    const markerPath=document.createElementNS('http://www.w3.org/2000/svg','path');
    markerPath.setAttribute('d','M0,0 L8,4 L0,8 z');markerPath.setAttribute('fill',edgeColor);marker.appendChild(markerPath);
    svg.querySelector('defs').appendChild(marker);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class',`dependency-link color-${chosenColorIndex}${hasCrossing?' has-crossing':''}`);
    path.style.stroke=edgeColor;
    path.style.setProperty('--dependency-color',edgeColor);
    path.style.setProperty('marker-end',`url(#${markerId})`);
    path.setAttribute('d',`M${x1},${y1} H${bendX} V${y2} H${x2}`);
    const title=document.createElementNS('http://www.w3.org/2000/svg','title');
    const taskNumber=outlineNumbers.get(predecessor.id)||'';
    const dependencyLabel=`${taskNumber}${type}${formatDependencyLag(dependency)}`;
    title.textContent=`${predecessor.name} → ${task.name} (${dependencyLabel})`;
    path.appendChild(title);
    svg.appendChild(path);
    renderedLinks.push({segments,colorIndex:chosenColorIndex,points:[{x:x1,y:y1},{x:bendX,y:y1},{x:bendX,y:y2},{x:x2,y:y2}]});
    const label=document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('class','dependency-link-label');
    label.dataset.taskId=String(task.id);
    label.dataset.linkIndex=String(linkIndex);
    label.dataset.labelText=dependencyLabel;
    label.dataset.targetEdge=toEdge;
    label.dataset.arrowX=String(x2);
    label.dataset.arrowY=String(y2);
    label.dataset.bendX=String(bendX);
    label.dataset.sourceX=String(x1);
    label.dataset.sourceY=String(y1);
    label.setAttribute('text-anchor','end');
    label.setAttribute('x',String(x2-8));
    label.setAttribute('y',String(y2-14));
    label.textContent=dependencyLabel;
    svg.appendChild(label);
  });
  const labelRects=[];
  const labelBackgrounds=[];
  const obstacleElements=[...body.querySelectorAll('.bar,.task-date-label,.task-name-above,.lane-node-date,.lane-node-label')].filter(element=>!element.closest('[hidden]'));
  const obstacleRects=obstacleElements.map(element=>{
    const rect=element.getBoundingClientRect();
    return {left:rect.left-scrollRect.left+scroll.scrollLeft,top:rect.top-bodyRect.top,right:rect.right-scrollRect.left+scroll.scrollLeft,bottom:rect.bottom-bodyRect.top};
  });
  const overlaps=(first,second)=>first.left<second.right+3&&first.right>second.left-3&&first.top<second.bottom+3&&first.bottom>second.top-3;
  const dependencyLabels=[...svg.querySelectorAll('.dependency-link-label')];
  dependencyLabels.forEach(label=>{
    const target={x:Number(label.dataset.arrowX),y:Number(label.dataset.arrowY)};
    const bend={x:Number(label.dataset.bendX),y:target.y};
    const start={x:Number(label.dataset.sourceX),y:Number(label.dataset.sourceY)};
    if(!Number.isFinite(target.x)||!Number.isFinite(target.y))return;
    const initialBox=label.getBBox();
    const labelAnchor='end';
    const arrowAdjacentX=target.x-8;
      const yCandidates=[target.y+3,target.y-13,target.y+19,target.y-29,target.y+35];
    let placed=false;
    let bestCandidate=null,bestScore=Infinity;
    for(const y of yCandidates){
      label.setAttribute('text-anchor',labelAnchor);
      label.setAttribute('x',String(arrowAdjacentX));
      label.setAttribute('y',String(y));
      const box=label.getBBox();
      const candidate={left:box.x,top:box.y,right:box.x+box.width,bottom:box.y+box.height};
      if(candidate.left<nameWidth||candidate.right>width||candidate.top<0||candidate.bottom>height)continue;
      const collisions=[...obstacleRects,...labelRects].filter(rect=>overlaps(candidate,rect));
      const score=collisions.length*1000+Math.abs(y-target.y);
      if(score<bestScore){bestScore=score;bestCandidate=candidate}
      if(!collisions.length){
        labelRects.push(candidate);labelBackgrounds.push(candidate);
        label.dataset.arrowDistance=String(Math.hypot(candidate.right-target.x,y-target.y));
        placed=true;break;
      }
    }
    if(!placed){
      const fallbackY=bestCandidate?bestCandidate.top+initialBox.height:target.y-12;
      label.setAttribute('text-anchor','end');
      label.setAttribute('x',String(arrowAdjacentX));
      label.setAttribute('y',String(fallbackY));
      const fallbackBox=label.getBBox();
      const fallbackRect={left:fallbackBox.x,top:fallbackBox.y,right:fallbackBox.x+fallbackBox.width,bottom:fallbackBox.y+fallbackBox.height};
      labelRects.push(fallbackRect);labelBackgrounds.push(fallbackRect);
      label.dataset.arrowDistance=String(Math.hypot(fallbackRect.right-target.x,fallbackRect.top+fallbackRect.height/2-target.y));
      label.classList.add('layout-near-arrow-overlap');
    }
  });
  svg.dataset.linkCount=String(renderedLinks.length);
  svg.dataset.crossingLinkCount=String(crossingLinkCount);
  scroll.insertBefore(svg,scroll.firstChild);
  const labelLayer=document.createElementNS('http://www.w3.org/2000/svg','svg');
  labelLayer.setAttribute('class','dependency-label-layer');
  labelLayer.setAttribute('width',String(width));
  labelLayer.setAttribute('height',String(height));

    background.setAttribute('height',String(box.bottom-box.top+4));
    background.setAttribute('rx','3');
    labelLayer.appendChild(background);
  });
  dependencyLabels.forEach(label=>labelLayer.appendChild(label));
  labelLayer.dataset.placedCount=String(labelRects.length);
  scroll.appendChild(labelLayer);
  runGanttLayoutAudit();
  restoreTimelineMenu();
}

function runGanttLayoutAudit(){
  const rows=[...document.querySelectorAll('#ganttBody tr[data-task-row-id]:not([hidden])')];
  const textRects=[...document.querySelectorAll('#ganttBody .task-date-label,#ganttBody .task-name-above,.dependency-label-layer .dependency-link-label')]
    .filter(element=>!element.closest('[hidden]'))
    .map(element=>({element,rect:element.getBoundingClientRect()}));
  const barRects=[...document.querySelectorAll('#ganttBody .bar:not(.milestone-symbol)')].map(element=>({element,rect:element.getBoundingClientRect()}));
  let barTextOverlaps=0;
  textRects.forEach(({element,rect})=>{
    const sameRow=element.closest('tr');
    if(!sameRow)return;
    if(barRects.some(({element:bar,rect:barRect})=>bar.closest('tr')===sameRow&&rect.left<barRect.right&&rect.right>barRect.left&&rect.top<barRect.bottom&&rect.bottom>barRect.top))barTextOverlaps++;
  });
  const dependencyLabels=[...document.querySelectorAll('.dependency-label-layer .dependency-link-label')];
  const arrowDistances=dependencyLabels.map(label=>Number(label.dataset.arrowDistance)).filter(Number.isFinite);
  document.documentElement.dataset.ganttLayoutAudit=JSON.stringify({rowCount:rows.length,barTextOverlaps,dependencyLabels:dependencyLabels.length,nearArrowFallbacks:document.querySelectorAll('.dependency-link-label.layout-near-arrow-overlap').length,averageArrowLabelDistance:arrowDistances.length?Math.round(arrowDistances.reduce((sum,value)=>sum+value,0)/arrowDistances.length):null,build:APP_BUILD_VERSION});
  return barTextOverlaps===0;
}

function getWeekInfo(date){
  const day=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  day.setUTCDate(day.getUTCDate()+4-(day.getUTCDay()||7));
  const year=day.getUTCFullYear();
  const yearStart=new Date(Date.UTC(year,0,1));
  const week=Math.ceil((((day-yearStart)/86400000)+1)/7);
  return {year,week};
}
function getTimelinePeriod(date,unit){
  const year=date.getFullYear(),month=date.getMonth(),day=date.getDate();
  if(unit==='year')return {key:String(year),label:`${year}年`};
  if(unit==='quarter'){
    const quarter=Math.floor(month/3)+1;
    return {key:`${year}-Q${quarter}`,label:`第${quarter}季度`};
  }
  if(unit==='month')return {key:`${year}-${month}`,label:`${month+1}月`};
  if(unit==='week'){
    const {year:weekYear,week}=getWeekInfo(date);
    return {key:`${weekYear}-W${week}`,label:`第${week}周`};
  }
  return {key:fmtDate(date),label:String(day)};
}
function groupTimelineDates(days,unit){
  const groups=[];
  days.forEach(date=>{
    const period=getTimelinePeriod(date,unit);
    const last=groups[groups.length-1];
    if(last&&last.key===period.key)last.count++;
    else groups.push({...period,count:1,startDate:date});
  });
  return groups;
}

function updateLevelControls(){
  const task=data.tasks.find(item=>item.id===selectedId);
  const canChange=Boolean(task&&!isLaneTask(task));
  const outdent=document.getElementById('outdentTask');
  const indent=document.getElementById('indentTask');
  const hint=document.getElementById('levelHint');
  if(!outdent||!indent||!hint)return;
  const previousSibling=task&&getPreviousSibling(task);
  outdent.disabled=!canChange||!task.parent;
  indent.disabled=!canChange||!previousSibling;
  hint.textContent=!task?'先选择一项任务':isLaneTask(task)?'泳道节点不支持调整层级':previousSibling?'可提升或降低一级':task.parent?'可提升一级':'前面没有同级任务可供嵌套';
}

function getPreviousSibling(task){
  const sorted=getSorted().filter(item=>!isLaneTask(item));
  const taskIndex=sorted.findIndex(item=>item.id===task.id);
  return sorted.slice(0,taskIndex).reverse().find(item=>(item.parent??undefined)===(task.parent??undefined));
}

function adjustTaskLevel(direction){
  const task=data.tasks.find(item=>item.id===selectedId);
  if(!task||isLaneTask(task))return;
  const ordered=getSorted();
  const taskDescendants=getTaskDescendantIds(task.id);
  const movingIds=new Set([task.id,...taskDescendants]);
  const movingBlock=ordered.filter(item=>movingIds.has(item.id));
  const remaining=ordered.filter(item=>!movingIds.has(item.id));
  let insertionIndex;
  if(direction<0){
    if(!task.parent)return;
    const oldParent=data.tasks.find(item=>item.id===task.parent);
    task.parent=oldParent?.parent;
    const parentTreeIds=new Set([oldParent?.id,...getTaskDescendantIds(oldParent?.id)].filter(id=>id!=null&&!movingIds.has(id)));
    insertionIndex=remaining.reduce((last,item,index)=>parentTreeIds.has(item.id)?index+1:last,0);
  }else{
    const previousSibling=getPreviousSibling(task);
    if(!previousSibling)return;
    task.parent=previousSibling.id;
    const previousTreeIds=new Set([previousSibling.id,...getTaskDescendantIds(previousSibling.id)]);
    insertionIndex=remaining.reduce((last,item,index)=>previousTreeIds.has(item.id)?index+1:last,0);
  }
  remaining.splice(insertionIndex,0,...movingBlock);
  data.tasks=remaining;
  saveData();
  renderAll();
}

function bindDurationFields(){
  const typeInput=document.getElementById('ef_type');
  const startInput=document.getElementById('ef_start');
  const endInput=document.getElementById('ef_end');
  const durationRow=document.getElementById('ef_duration_row');
  const durationInput=document.getElementById('ef_duration');
  const dateRow=document.getElementById('ef_date_row');
  const endDateGroup=document.getElementById('ef_end_group');
  const nodeDateRow=document.getElementById('ef_node_date_row');
  const nodeDateInput=document.getElementById('ef_node_date');
  const nodeSymbolRow=document.getElementById('ef_node_symbol_row');
  const nodeSymbolInput=document.getElementById('ef_node_symbol');
  const symbolRow=document.getElementById('ef_symbol_row');
  const summaryColorRow=document.getElementById('ef_summary_color_row');
  const nodeContentGroup=document.getElementById('ef_node_content_group');
  const progressGroup=document.getElementById('ef_progress_group');
  const assignmentRow=document.getElementById('ef_assignment_row');
  const dependencyRow=document.getElementById('ef_dependency_row');
  const dependencyLagRow=document.getElementById('ef_dependency_lag_row');
  const dependencyInput=document.getElementById('ef_dependency');
  const formTitle=document.getElementById('ef_form_title');
  const submitButton=document.getElementById('ef_submit_button');
  const addButton=document.getElementById('ef_add_button');
  if(!typeInput||!startInput||!endInput||!durationRow||!durationInput)return;

  const updateEndDate=()=>{
    const duration=Math.max(1,Math.floor(Number(durationInput.value)||1));
    durationInput.value=String(duration);
    endInput.value=getEndDate(startInput.value,duration);
  };
  const syncTaskFields=()=>{
    const isTask=typeInput.value==='task';
    const isSummary=typeInput.value==='summary';
    const isMilestone=typeInput.value==='milestone';
    const isNode=typeInput.value==='customerMilestone'||typeInput.value==='supplierNode';
    if(isNode&&nodeDateInput&&!nodeDateInput.value)nodeDateInput.value=startInput.value;
    if(dateRow)dateRow.hidden=isNode;
    if(endDateGroup)endDateGroup.hidden=isMilestone;
    if(nodeDateRow)nodeDateRow.hidden=!isNode;
    if(nodeSymbolRow)nodeSymbolRow.hidden=!isNode;
    if(nodeSymbolInput&&isNode){
      const currentTask=selectedId===null?null:data.tasks.find(task=>task.id===selectedId);
      nodeSymbolInput.value=currentTask?.type===typeInput.value?getMilestoneSymbol(currentTask):typeInput.value==='supplierNode'?'▲':'◆';
      nodeSymbolRow.querySelector('.color-reset')?.setAttribute('onclick',"resetEditNodeSymbol()");
    }
    if(symbolRow)symbolRow.hidden=!isMilestone;
    if(summaryColorRow)summaryColorRow.hidden=!isSummary;
    const summaryColorInput=document.getElementById('ef_summary_color');
    const symbolColorInput=document.getElementById('ef_symbol_color');
    if(isSummary&&summaryColorInput&&selectedId!==null){
      const currentTask=data.tasks.find(task=>task.id===selectedId);
      summaryColorInput.value=(currentTask?.type==='summary'&&currentTask.color)||'#4361ee';
    }
    if(isMilestone&&symbolColorInput&&selectedId!==null){
      const currentTask=data.tasks.find(task=>task.id===selectedId);
      symbolColorInput.value=(currentTask?.type==='milestone'&&currentTask.color)||'#ff9800';
    }
    if(isSummary&&summaryColorInput&&selectedId===null)summaryColorInput.value='#4361ee';
    if(isMilestone&&symbolColorInput&&selectedId===null)symbolColorInput.value='#ff9800';
    if(nodeContentGroup)nodeContentGroup.hidden=!isNode;
    durationRow.hidden=!isTask;
    startInput.disabled=isSummary;
    endInput.disabled=isSummary||!isTask;
    if(isMilestone)endInput.value=startInput.value;
    if(progressGroup)progressGroup.hidden=false;
    const progressInput=document.getElementById('ef_progress');
    if(progressInput)progressInput.disabled=isSummary;
    if(isSummary&&selectedId!==null){
      const metrics=getSummaryMetrics(data.tasks.find(task=>task.id===selectedId));
      if(metrics){startInput.value=metrics.start;endInput.value=metrics.end;if(progressInput)progressInput.value=String(Math.round(metrics.progress*100))}
    }
    if(assignmentRow)assignmentRow.hidden=isNode;
    if(dependencyRow)dependencyRow.hidden=isNode;
    if(dependencyLagRow)dependencyLagRow.hidden=isNode||!dependencyInput?.value;
    if(formTitle){
      const editing=selectedId!==null;
      formTitle.textContent=isNode?(editing?'✏️ 编辑节点':'➕ 新增节点'):(editing?`✏️ 编辑任务 #${selectedId}`:'➕ 新增任务');
    }
    if(submitButton)submitButton.textContent=isNode?'✅ 创建节点':'✅ 创建任务';
    if(addButton)addButton.textContent=isNode?'➕ 新增节点':'➕ 新增任务';
    if(isTask)updateEndDate();
  };
  typeInput.addEventListener('change',syncTaskFields);
  dependencyInput?.addEventListener('change',()=>{
    if(dependencyLagRow)dependencyLagRow.hidden=!dependencyInput.value;
  });
  syncTaskFields();
  if(nodeDateInput){
    const updateNodeDateReminder=()=>{
      const missing=!nodeDateInput.value;
      nodeDateInput.classList.toggle('node-date-required',missing);
      nodeDateInput.setAttribute('aria-invalid',String(missing));
    };
    nodeDateInput.addEventListener('input',updateNodeDateReminder);
    nodeDateInput.addEventListener('change',updateNodeDateReminder);
    updateNodeDateReminder();
  }
  startInput.addEventListener('change',()=>{
    if(typeInput.value==='task')updateEndDate();
    else if(typeInput.value==='milestone')endInput.value=startInput.value;
  });
  durationInput.addEventListener('input',()=>{
    if(typeInput.value==='task'){
      const duration=Math.max(1,Math.floor(Number(durationInput.value)||1));
      endInput.value=getEndDate(startInput.value,duration);
    }
  });
  durationInput.addEventListener('change',()=>{
    if(typeInput.value==='task')updateEndDate();
  });
  syncTaskFields();
}

// ===== 增删改 =====
function saveEdit(){
  const t=data.tasks.find(x=>x.id===selectedId);
  if(!t)return;
  const previousType=t.type;
  const nextType=document.getElementById('ef_type').value;
  const dependencyId=document.getElementById('ef_dependency').value;
  if(!validateDependency(t.id,dependencyId))return;
  const previousParentId=t.parent;
  const parentId=document.getElementById('ef_parent').value;
  const nextParentId=resolveParentAfterTypeChange(t,previousType,nextType,parentId);
  detachChildrenWhenChangingToMilestone(t,nextType);
  t.name=document.getElementById('ef_name').value.trim()||t.name;
  t.type=nextType;
  if(isLaneTask(t)&&!document.getElementById('ef_node_date').value){
    const nodeDateInput=document.getElementById('ef_node_date');
    nodeDateInput.classList.add('node-date-required');
    nodeDateInput.setAttribute('aria-invalid','true');
    alert('请选择节点时间');
    nodeDateInput.focus();
    return;
  }
  t.start=isLaneTask(t)?document.getElementById('ef_node_date').value:document.getElementById('ef_start').value;
  t.end=t.type==='task'?getEndDate(t.start,document.getElementById('ef_duration').value):isMilestoneTask(t)?t.start:document.getElementById('ef_end').value;
  t.durationDays=t.type==='task'?getDurationDays(t.start,t.end):1;
  if(nextType!=='summary')t.progress=Math.min(1,Math.max(0,parseInt(document.getElementById('ef_progress').value||'0')/100));
  t.assignee=document.getElementById('ef_assignee').value.trim()||'';
  t.parent=nextParentId;
  if(nextType==='summary'&&previousType!=='summary'&&previousParentId!=null){
    moveTaskTreeAfterParent(t,t.parent);
  }
  t.dependency=dependencyId?{taskId:data.tasks.find(item=>String(item.id)===String(dependencyId)).id,type:document.getElementById('ef_dependency_type').value,lagSign:document.getElementById('ef_dependency_lag_sign').value,lagValue:Math.max(0,Number(document.getElementById('ef_dependency_lag_value').value)||0),lagUnit:document.getElementById('ef_dependency_lag_unit').value}:undefined;
  if(isLaneTask(t))t.parent=undefined;
  if(t.type==='summary'||isLaneTask(t))t.assignee='';
  if(isMilestoneTask(t)){t.end=t.start}
  t.symbol=nextType==='milestone'?document.getElementById('ef_symbol').value:isLaneTask(t)?document.getElementById('ef_node_symbol').value:undefined;
  if(nextType==='summary')t.color=document.getElementById('ef_summary_color').value;
  else if(nextType==='milestone')t.color=document.getElementById('ef_symbol_color').value;
  else if(previousType==='summary'||previousType==='milestone')t.color=undefined;
  t.content=isLaneTask(t)?t.name:undefined;
  recalculateDependencySchedule();
  saveData();
  renderAll();
}

function addNewTask(){
  const name=document.getElementById('ef_name').value.trim();
  if(!name){alert('请输入任务名称');return}
  const type=document.getElementById('ef_type').value;
  const hasTopLevelSummary=data.tasks.some(task=>task.type==='summary'&&task.parent==null);
  if(type==='summary'&&!hasTopLevelSummary){
    const phaseName=prompt('输入项目名称（例如：OBC 系统开发）',data.projectName||'');
    if(phaseName===null)return;
    if(!phaseName.trim()){alert('项目名称不能为空');return}
    data.projectName=phaseName.trim();
    projectNameInput.value=data.projectName;
  }
  if(!isLaneTask({type})&&!document.getElementById('ef_start').value){
    alert('请选择开始日期');
    document.getElementById('ef_start').focus();
    return;
  }
  if(isLaneTask({type})&&!document.getElementById('ef_node_date').value){
    const nodeDateInput=document.getElementById('ef_node_date');
    nodeDateInput.classList.add('node-date-required');
    nodeDateInput.setAttribute('aria-invalid','true');
    alert('请选择节点时间');
    nodeDateInput.focus();
    return;
  }
  const start=isLaneTask({type})?document.getElementById('ef_node_date').value:document.getElementById('ef_start').value;
  const task={
    id:nextId++,
    name:name,
    start:start,
    type:type,
    end:'',
    progress:Math.min(1,Math.max(0,parseInt(document.getElementById('ef_progress').value||'0')/100)),
    assignee:document.getElementById('ef_assignee').value.trim()||undefined,
  };
  if(!task.start){alert('请选择开始日期');return}
  task.end=task.type==='task'?getEndDate(task.start,document.getElementById('ef_duration').value):isMilestoneTask(task)?task.start:document.getElementById('ef_end').value;
  task.durationDays=task.type==='task'?getDurationDays(task.start,task.end):1;
  const pid=document.getElementById('ef_parent').value;
  if(pid)task.parent=parseInt(pid);
  const dependencyId=isLaneTask(task)?'':document.getElementById('ef_dependency').value;
  if(!validateDependency(null,dependencyId))return;
  if(dependencyId)task.dependency={taskId:data.tasks.find(item=>String(item.id)===String(dependencyId)).id,type:document.getElementById('ef_dependency_type').value,lagSign:document.getElementById('ef_dependency_lag_sign').value,lagValue:Math.max(0,Number(document.getElementById('ef_dependency_lag_value').value)||0),lagUnit:document.getElementById('ef_dependency_lag_unit').value};
  if(isLaneTask(task)){delete task.parent;delete task.assignee}
  if(task.type==='summary')delete task.assignee;
  if(isMilestoneTask(task))task.end=task.start;
  if(isMilestoneTask(task))task.symbol=document.getElementById('ef_symbol').value;
  if(isLaneTask(task))task.symbol=document.getElementById('ef_node_symbol').value||'◆';
  if(task.type==='summary')task.color=document.getElementById('ef_summary_color').value;
  else if(task.type==='milestone')task.color=document.getElementById('ef_symbol_color').value;
  if(isLaneTask(task))task.content=task.name;
  data.tasks.push(task);
  recalculateDependencySchedule();
  selectedId=task.id;
  saveData();
  renderAll();
}

function deleteTask(id){
  if(!confirm(`确定要删除该任务吗？`))return;
  const removedIds=new Set([id,...getTaskDescendantIds(id)]);
  data.tasks=data.tasks.filter(x=>!removedIds.has(x.id));
  data.tasks.forEach(task=>{
    if(task.dependency&&removedIds.has(Number(task.dependency.taskId)))delete task.dependency;
  });
  if(removedIds.has(selectedId))selectedId=null;
  saveData();

function printGanttPdf(){

  renderGantt();
  translateInterfaceTree();
  const table=document.getElementById('ganttTable');

  const pageWidth=16.54*96-53;
  const pageHeight=11.69*96-53;
  const gutter=30;
  const originalWidth=table.scrollWidth;
  const originalHeight=table.getBoundingClientRect().height;
  const scale=Math.min(1,(pageWidth-gutter*2)/originalWidth,(pageHeight-gutter*2)/originalHeight);

  scroll.style.setProperty('--pdf-table-width',`${originalWidth*scale}px`);

  document.head.appendChild(printStyle);

}

async function readZip(blob){
  const bytes=new Uint8Array(await blob.arrayBuffer());
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);

  for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65558);i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break}}

  const count=view.getUint16(eocd+10,true);let cursor=view.getUint32(eocd+16,true);const files=new Map();
  for(let entry=0;entry<count;entry++){
    if(view.getUint32(cursor,true)!==0x02014b50)throw new Error('XLSX 目录格式无效');
    const method=view.getUint16(cursor+10,true),compressedSize=view.getUint32(cursor+20,true);
    const nameLength=view.getUint16(cursor+28,true),extraLength=view.getUint16(cursor+30,true),commentLength=view.getUint16(cursor+32,true),localOffset=view.getUint32(cursor+42,true);
    const name=new TextDecoder().decode(bytes.subarray(cursor+46,cursor+46+nameLength));
    const localNameLength=view.getUint16(localOffset+26,true),localExtraLength=view.getUint16(localOffset+28,true);

    let content=bytes.slice(dataStart,dataStart+compressedSize);
    if(method===8){
      if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持读取压缩 XLSX，请使用最新版本的 Edge 或 Chrome');

      content=new Uint8Array(await new Response(stream).arrayBuffer());

    files.set(name,new TextDecoder().decode(content));
    cursor+=46+nameLength+extraLength+commentLength;
  }
  return files;
}
function parseXml(xmlText){

function excelDateValue(value){

    return fmtDate(new Date(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate()));
